<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>メルカリへ移動中...</title>
  <style>
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #FF0211;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: white;
      text-align: center;
    }
    .logo {
      font-size: 48px;
      font-weight: bold;
      margin-bottom: 16px;
      letter-spacing: -1px;
    }
    p {
      font-size: 16px;
      opacity: 0.85;
      margin: 0 0 32px;
    }
    a {
      color: white;
      font-size: 14px;
      opacity: 0.7;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="logo">mercari</div>
  <p>アプリを起動しています...</p>
  <a href="https://jp.mercari.com/user/profile/616001180">ブラウザで開く</a>

  <script>
    const userId = "616001180";
    const webUrl = "https://jp.mercari.com/user/profile/" + userId;

    const ua = navigator.userAgent.toLowerCase();
    const isIOS = /iphone|ipad|ipod/.test(ua);
    const isAndroid = /android/.test(ua);

    if (isIOS) {
      // iOS: Universal Link を試みる
      window.location = "jp.mercari.com://user/profile/" + userId;
      setTimeout(() => { window.location = webUrl; }, 1200);
    } else if (isAndroid) {
      // Android: Intent URL でアプリ起動を試みる
      window.location = "intent://user/profile/" + userId +
        "#Intent;scheme=mercari;package=com.kouzoh.mercari;S.browser_fallback_url=" +
        encodeURIComponent(webUrl) + ";end";
    } else {
      // PC等: そのままWebへ
      window.location = webUrl;
    }
  </script>
</body>
</html>
